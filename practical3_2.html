<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practical 3 - HTML Table</title>
    <style>
        table {
            border-collapse: collapse;
            width: 80%;
            margin: 30px auto;
            font-family: Arial, sans-serif;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        th, td {
            border: 1px solid #555;
            padding: 10px 15px;
            text-align: center;
        }

        th {
            background-color: #2c3e50;
            color: #ffffff;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tfoot td {
            font-weight: bold;
            background-color: #eaf2f8;
        }
    </style>
</head>
<body>

    <table>
        <caption>Student Marksheet</caption>
        <thead>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Subject</th>
                <th>Marks (out of 100)</th>
                <th>Grade</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Aarav Patel</td>
                <td>Web Technologies</td>
                <td>85</td>
                <td>A</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Diya Shah</td>
                <td>Web Technologies</td>
                <td>92</td>
                <td>A+</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Kabir Mehta</td>
                <td>Web Technologies</td>
                <td>76</td>
                <td>B+</td>
            </tr>
            <tr>
                <td>4</td>
                <td rowspan="2">Riya Joshi</td>
                <td>Web Technologies</td>
                <td>88</td>
                <td>A</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Database Systems</td>
                <td>81</td>
                <td>A</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3">Average Marks</td>
                <td colspan="2">84.4</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
